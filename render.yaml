services:
  - type: web
    name: profgui-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm run start
    healthCheckPath: /api/teachers
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: eliebarresbeavogui3@gmail.com
      - key: ADMIN_PHONE
        value: "629516388"
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://profgui-gn.web.app
      - key: CORS_ORIGIN
        value: https://profgui-gn.web.app,https://profgui-gn.firebaseapp.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
